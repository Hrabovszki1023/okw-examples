name: "Stage 3: Integration Test (TestPyPI)"

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  rest-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packages from TestPyPI
        run: |
          python3 -m venv venv
          . venv/bin/activate
          pip install --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            robotframework-okw-api-rest

      - name: Run REST JSONPlaceholder tests
        run: |
          . venv/bin/activate
          cd rest-api/jsonplaceholder
          robot --outputdir ../../results/jsonplaceholder tests/

      - name: Run REST DummyJSON tests
        run: |
          . venv/bin/activate
          cd rest-api/dummyjson
          robot --outputdir ../../results/dummyjson tests/REST_DummyJSON.robot

  selenium-tests:
    runs-on: ubuntu-latest
    env:
      OKW_BROWSER_HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install packages from TestPyPI
        run: |
          python3 -m venv venv
          . venv/bin/activate
          pip install --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            robotframework-okw-web-selenium

      - name: Run Selenium ExpandTesting tests (headless Chrome)
        run: |
          . venv/bin/activate
          cd selenium/expandtesting
          robot --outputdir ../../results/selenium \
            tests/DynamicTable.robot \
            tests/Hovers.robot \
            tests/ShouldBe.robot
