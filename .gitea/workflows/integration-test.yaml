name: "Stage 3: Integration Test (TestPyPI)"

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  rest-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packages from TestPyPI
        run: |
          python3 -m venv venv
          . venv/bin/activate
          pip install --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            robotframework-okw-api-rest

      - name: Run REST JSONPlaceholder tests
        run: |
          . venv/bin/activate
          cd rest-api/jsonplaceholder
          robot --outputdir ../../results/jsonplaceholder tests/

      - name: Run REST DummyJSON tests
        run: |
          . venv/bin/activate
          cd rest-api/dummyjson
          robot --outputdir ../../results/dummyjson tests/REST_DummyJSON.robot

  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install all OKW packages from TestPyPI
        run: |
          python3 -m venv venv
          . venv/bin/activate
          pip install --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            okw-contract-utils \
            robotframework-okw4robot \
            robotframework-okw-env \
            robotframework-okw-remote-ssh \
            robotframework-okw-env-docker

      - name: Verify imports
        run: |
          . venv/bin/activate
          python3 -c "
          import okw_contract_utils; print('okw-contract-utils OK')
          import okw4robot; print('okw4robot OK')
          import okw_env; print('okw-env OK')
          import robotframework_okw_remote_ssh; print('okw-remote-ssh OK')
          import okw_env_docker; print('okw-env-docker OK')
          "

  selenium-tests:
    runs-on: ubuntu-latest
    env:
      OKW_BROWSER_HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install packages from TestPyPI
        run: |
          python3 -m venv venv
          . venv/bin/activate
          pip install --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            robotframework-okw-web-selenium

      - name: Run Selenium ExpandTesting tests (headless Chrome)
        run: |
          . venv/bin/activate
          cd selenium/expandtesting
          robot --outputdir ../../results/selenium \
            tests/DynamicTable.robot \
            tests/Hovers.robot \
            tests/ShouldBe.robot

  the-internet-tests:
    runs-on: ubuntu-latest
    env:
      OKW_BROWSER_HEADLESS: "true"
      DOCKER_HOST: tcp://192.168.1.123:2375
      OKW_DOCKER_HOSTNAME: 192.168.1.123
    steps:
      - uses: actions/checkout@v4

      - name: Install packages from TestPyPI
        run: |
          python3 -m venv venv
          . venv/bin/activate
          pip install --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            robotframework-okw-web-selenium \
            robotframework-okw-env-docker

      - name: Run the-internet tests (Docker + headless Chrome)
        run: |
          . venv/bin/activate
          cd selenium/the-internet
          robot --outputdir ../../results/the-internet \
            tests/Login.robot \
            tests/Checkboxes.robot \
            tests/Dropdown.robot
