KafkaTestBroker:
  provider: docker
  docker_host: tcp://192.168.1.123:2375
  image: apache/kafka
  version: "3.9.2"
  port: 9092
  host_port: 9092
  env:
    KAFKA_NODE_ID: "1"
    KAFKA_PROCESS_ROLES: "broker,controller"
    KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
    KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://192.168.1.123:9092"
    KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
    KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    CLUSTER_ID: "okw-kafka-test-cluster-001"
  healthcheck: "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
  timeout: 90s
